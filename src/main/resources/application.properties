spring.application.name=v2x-tools-engine
# Listen on IPv6 too: Railway private networking (<service>.railway.internal) is IPv6-only
server.address=::
server.port=${PORT:8090}
# The hub reaches the engine over Railway private networking (2026-11-19); every endpoint but GET
# /engine/loaded requires X-Internal-Token (INTERNAL_TOKEN, same value as hub and repo).
internal.token=${INTERNAL_TOKEN:}
